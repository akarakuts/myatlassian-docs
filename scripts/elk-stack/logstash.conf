input {
  # HTTP input for my* suite apps
  http {
    port => 5044
    codec => json
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{/ {
    json {
      source => "message"
    }
  }
  
  # Add timestamp
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
  
  # Add service name
  if [source] {
    mutate {
      add_field => { "service" => "%{source}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "my-suite-logs-%{+YYYY.MM.dd}"
  }
  
  # Debug output
  # stdout { codec => rubydebug }
}
